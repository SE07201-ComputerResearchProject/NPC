<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="CSS/styles.css" />
  <link rel="stylesheet" href="CSS/dashboard.css" />
  <title>Breaking Bad Builder - Account</title>
</head>
<body class="bg-light text-dark">

  <!-- Navbar 1 (Top) -->
  <nav class="navbar navbar-expand-lg navbar-secondary bg-secondary fixed-top" id="navbarTop">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Breaking Bad Builder</a>
      <div class="d-flex ms-auto align-items-center">
        <span id="welcomeMsg" class="text-white me-3"></span>
        <button id="toggleTheme" class="btn btn-outline-light me-2" title="Toggle theme">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </div>
   </nav>

  <!-- Background (dark theme only) -->
  <div class="background retrowave"></div>

  <div class="content">
    <div class="container-fluid">
      <div class="row">
        <!-- left panel: account form -->
        <div class="col-md-6">
          <div class="square-panel">
            <h1>Account Information</h1>
            <div class="d-flex align-items-center gap-3 mb-3" id="accountIdentity" style="display:none !important;">
              <img id="accountAvatar" src="" alt="Account Avatar" width="56" height="56" style="display:none;border-radius:50%;object-fit:cover;border:1px solid #ccc;">
              <div>
                <div class="small text-muted">Signed in via</div>
                <div class="fw-semibold" id="accountProvider">Local Account</div>
              </div>
            </div>
            <form id="profileForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" required>
              </div>

              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email (Read-only)</label>
                <input type="email" id="email" class="form-control" readonly style="background-color: #e9ecef;">
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Your full name">
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" id="dob" class="form-control">
              </div>
            </div>
            <div class="row">
              <div class="col-md-12 mb-3">
                <label for="street" class="form-label">Street Address</label>
                <input type="text" id="street" class="form-control" placeholder="123 Main St">
              </div>
              <div class="col-md-6 mb-3">
                <label for="city" class="form-label">City</label>
                <input type="text" id="city" class="form-control" placeholder="City">
              </div>
              <div class="col-md-3 mb-3">
                <label for="state" class="form-label">State</label>
                <input type="text" id="state" class="form-control" placeholder="State">
              </div>
              <div class="col-md-3 mb-3">
                <label for="zip" class="form-label">ZIP Code</label>
                <input type="text" id="zip" class="form-control" placeholder="ZIP">
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
          </form>
            <button id="logoutBtn" class="btn btn-danger mt-3">Log out</button>
          </div>
        </div>
        <!-- right panel: saved build summary -->
        <div class="col-md-6">
          <div class="square-panel">
            <h3>Your Saved Build</h3>
            <div class="build-panel p-3 border rounded">
              <p><strong>Name:</strong> <span id="panelBuildName">New Build</span></p>
              <p><strong>Total:</strong> <span id="panelTotalPrice">₫0</span></p>
              <p><strong>Compatibility:</strong> <span id="panelCompatibility" class="compatible">✓ Compatible</span></p>
              <p><strong>Power:</strong> <span id="panelPowerDraw">0W</span></p>
              <h5>Components</h5>
              <div class="parts-list" id="panelPartsList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom floating menu -->
  <div class="floating-menu">
    <a href="index.html" class="menu-item">
      <i data-lucide="home"></i>
      <span class="label">Home</span>
    </a>
    <a href="dashboard.html" class="menu-item">
      <i data-lucide="pencil-ruler"></i>
      <span class="label">Build PC</span>
    </a>
    <a href="#" class="menu-item" onclick="toggleComponentsMenu(event)">
      <i data-lucide="cpu"></i>
      <span class="label">Components</span>
    </a>
    <div class="account-wrapper">
      <a href="#" class="menu-item">
        <i data-lucide="user"></i>
        <span class="label">Account</span>
      </a>
      <div class="account-dropdown">
        <a href="#" onclick="goToAccount(event)">Account Info</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="JS/app.js"></script>
  <script src="JS/components-menu.js"></script>
  <script src="JS/auth-popup.js"></script>
  <script src="JS/account.js"></script>
</body>
</html>
