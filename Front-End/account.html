<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="CSS/styles.css" />
  <title>Breaking Bad Builder - Account</title>
</head>
<body class="bg-light text-dark">

  <!-- Navbar 1 (Top) -->
  <nav class="navbar navbar-expand-lg navbar-secondary bg-secondary fixed-top" id="navbarTop">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Breaking Bad Builder</a>
      <div class="d-flex ms-auto align-items-center">
        <span id="welcomeMsg" class="text-white me-3"></span>
        <button id="toggleTheme" class="btn btn-outline-light me-2" title="Toggle theme">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </div>
   </nav>

  <!-- Background (dark theme only) -->
  <div class="background retrowave"></div>

  <div class="content">
    <h1>Account Information</h1>
    <form id="profileForm">
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-control">
      </div>
      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" id="dob" class="form-control">
      </div>
      <div class="mb-3">
        <label for="place" class="form-label">Place</label>
        <input type="text" id="place" class="form-control">
      </div>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Change password (leave blank to keep)">
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <button id="logoutBtn" class="btn btn-danger mt-3">Log out</button>
  </div>

  <!-- Bottom floating menu -->
  <div class="floating-menu">
    <a href="index.html" class="menu-item">
      <i data-lucide="home"></i>
      <span class="label">Home</span>
    </a>
    <a href="dashboard.html" class="menu-item">
      <i data-lucide="pencil-ruler"></i>
      <span class="label">Build PC</span>
    </a>
    <a href="#" class="menu-item" onclick="toggleComponentsMenu(event)">
      <i data-lucide="cpu"></i>
      <span class="label">Components</span>
    </a>
    <div class="account-wrapper">
      <a href="#" class="menu-item">
        <i data-lucide="user"></i>
        <span class="label">Account</span>
      </a>
      <div class="account-dropdown">
        <a href="#" onclick="goToAccount(event)">Account Info</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="JS/app.js"></script>
  <script src="JS/components-menu.js"></script>
  <script src="JS/auth-popup.js"></script>
  <script>
    // redirect if not logged in
    document.addEventListener('DOMContentLoaded', () => {
      window.isLoggedIn = getAuthState();
      if (!window.isLoggedIn) {
        // send back to home and prompt login
        window.location.href = 'index.html';
        return;
      }
      // placeholder account info
      document.getElementById('accountDetails').textContent = 'You are logged in. (User info would display here.)';

      document.getElementById('logoutBtn').addEventListener('click', () => {
        logout();
      });

      // profile persistence
      const profileForm = document.getElementById('profileForm');
      function loadProfile() {
        const p = getProfile();
        if (p) {
          document.getElementById('fullName').value = p.fullName || '';
          document.getElementById('dob').value = p.dob || '';
          document.getElementById('place').value = p.place || '';
          document.getElementById('username').value = p.username || '';
          // password not filled
        }
      }
      function saveProfile(e) {
        e.preventDefault();
        const prev = getProfile();
        const p = {
          fullName: document.getElementById('fullName').value,
          dob: document.getElementById('dob').value,
          place: document.getElementById('place').value,
          username: document.getElementById('username').value,
          // simply preserve existing password if not changed
          password: document.getElementById('password').value || (prev.password || '')
        };
        saveProfile(p);
        alert('Profile saved');
        // update welcome message if displayed
        if (window.updateWelcomeMessage) window.updateWelcomeMessage();
      }
      if (profileForm) {
        profileForm.addEventListener('submit', saveProfile);
        loadProfile();
      }
    });
  </script>
</body>
</html>
