<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="CSS/styles.css" />
  <!-- Title-->
  <title>Breaking Bad Builder - Home</title>
</head>
<body class="bg-light text-dark">

  <!-- Navbar 1 (Top) -->
  <nav class="navbar navbar-expand-lg navbar-secondary bg-secondary fixed-top" id="navbarTop">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Breaking Bad Builder</a>
      <div class="d-flex ms-auto align-items-center">
        <span id="welcomeMsg" class="text-white me-3"></span>
        <button id="toggleTheme" class="btn btn-outline-light me-2" title="Toggle theme">
          <i id="themeIcon" data-lucide="moon"></i>
        </button>
      </div>
    </div>
   </nav>

  <!-- Background (dark theme only animation, blurred so content shows through) -->
  <div class="background retrowave"></div>

  <div class="components-floating-layer" id="floatingComponentsLayer" aria-hidden="true">
    <div class="floating-chip chip-1">
      <img src="Assets/Floating/cpu-card.svg" alt="CPU" loading="lazy">
      <span>CPU</span>
    </div>
    <div class="floating-chip chip-2">
      <img src="Assets/Floating/motherboard-card.svg" alt="Motherboard" loading="lazy">
      <span>Motherboard</span>
    </div>
    <div class="floating-chip chip-3">
      <img src="Assets/Floating/ram-card.svg" alt="RAM" loading="lazy">
      <span>RAM</span>
    </div>
    <div class="floating-chip chip-4">
      <img src="Assets/Floating/storage-card.svg" alt="Storage" loading="lazy">
      <span>Storage</span>
    </div>
    <div class="floating-chip chip-5">
      <img src="Assets/Floating/cooling-card.svg" alt="Cooling" loading="lazy">
      <span>Cooling</span>
    </div>
    <div class="floating-chip chip-6">
      <img src="Assets/Floating/power-card.svg" alt="Power" loading="lazy">
      <span>Power</span>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <!-- Welcome Message -->
    <h1>Welcome to Breaking Bad Builder</h1>
    <p>Build your dream PC with our easy-to-use simulator!
      <br>Featuring <span class="typing"></span>
    </p>
    <a href="dashboard.html" class="btn btn-start">Start Building</a>
  </div>

  <!-- Bottom floating menu -->
  <div class="floating-menu">

    <a href="index.html" class="menu-item">
      <i data-lucide="home"></i>
      <span class="label">Home</span>
    </a>

    <a href="dashboard.html" class="menu-item">
      <i data-lucide="pencil-ruler"></i>
      <span class="label">Build PC</span>
    </a>

    <a href="#" class="menu-item" onclick="toggleComponentsMenu(event)">
      <i data-lucide="cpu"></i>
      <span class="label">Components</span>
    </a>

    <a href="shopping-cart.html" class="menu-item">
      <i data-lucide="shopping-cart"></i>
      <span class="label">Cart</span>
    </a>

    <div class="account-wrapper">
      <a href="#" class="menu-item">
        <i data-lucide="user"></i>
        <span class="label">Account</span>
      </a>
      <div class="account-dropdown">
        <a href="#" onclick="goToAccount(event)">Account Info</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
  <!-- Animate JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
  <!-- Custom JS -->
  <script src="JS/app.js"></script>
  <script src="JS/products-menu.js"></script>
  <script src="JS/components-menu.js"></script>
  <script src="JS/auth-popup.js"></script>
</body>
</html>
