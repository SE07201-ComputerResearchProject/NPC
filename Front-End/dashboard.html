<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="CSS/styles.css" />
  <link rel="stylesheet" href="CSS/dashboard.css" />
  <!-- Title-->
  <title>Breaking Bad Builder - Dashboard</title>
</head>
<body class="bg-light text-dark">

  <!-- Navbar 1 (Top) -->
  <nav class="navbar navbar-expand-lg navbar-secondary bg-secondary fixed-top" id="navbarTop">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Breaking Bad Builder</a>
      <div class="d-flex ms-auto">
        <button id="toggleTheme" class="btn btn-outline-light me-2">🌙/☀️</button>
        <a href="login.html" class="btn btn-outline-light me-2">Log In</a>
        <a href="register.html" class="btn btn-SignUp btn">Sign Up</a>
      </div>
    </div>
   </nav>

  <!-- Navbar 2 (Sidebar) -->
  <div class="sidebar sidebar-expand-lg sidebar-secondary bg-secondary" id="sidebar">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link active" href="dashboard.html">Dashboard (Build PC)</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="products.html">Products</a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="background"></div>
  <div class="container-fluid dashboard-container">
    <!-- Header Stats -->
    <div class="build-header">
      <div class="header-top">
        <h2>New Build</h2>
        <span class="header-date">March 6, 2026</span>
      </div>
      
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-label">Total Price</span>
          <span class="stat-value" id="totalPrice">₫0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Compatibility</span>
          <span class="stat-value compatible" id="compatibility">✓ Compatible</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Power Draw</span>
          <span class="stat-value" id="powerDraw">0W</span>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-sm btn-outline-secondary">Share</button>
        <button class="btn btn-sm btn-outline-secondary">Clone Build</button>
        <button class="btn btn-sm btn-outline-secondary">Build Settings</button>
      </div>
    </div>

    <!-- Parts List -->
    <div class="parts-section">
      <h4>Parts List</h4>
      <div class="parts-list" id="partsList">
        <!-- Parts will be rendered here -->
      </div>
    </div>

    <!-- Additional Products -->
    <div class="additional-products">
      <h5>Additional Products</h5>
      <div class="additional-buttons">
        <button class="btn btn-sm btn-outline-secondary">Thermal Compound</button>
        <button class="btn btn-sm btn-outline-secondary">Operating System</button>
        <button class="btn btn-sm btn-outline-secondary">Sound Card</button>
        <button class="btn btn-sm btn-outline-secondary">Network Card</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Animate JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
  <!-- Custom JS -->
  <script src="JS/app.js"></script>
  <script src="JS/dashboard.js"></script>
</body>
</html>
