<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chatbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(140deg, #e7f3ff, #f3fcff 45%, #eef6ff);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .chatcard {
      width: min(100%, 920px);
      border-radius: 14px;
      border: 1px solid #c9d8ef;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(44, 67, 120, 0.12);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      max-height: 84vh;
    }
    .header {
      background: linear-gradient(120deg, #4b68ff, #5f8bff);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 14px 16px;
      border-bottom: 1px solid #d2e2ff;
    }
    .window {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f8fbff;
    }
    .bubble {
      max-width: 80%;
      border-radius: 14px;
      padding: 11px 14px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }
    .user .bubble { margin-left: auto; color: #fff; background: #3d6bff; }
    .bot .bubble { margin-right: auto; color: #122c5b; background: #e4ecff; }
    .input-area {
      border-top: 1px solid #dfe8ff;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: #fcfeff;
    }
    .input-area input {
      border: 1px solid #b9c9e7;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      width: 100%;
    }
    .input-area button {
      background: #3d6bff;
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 16px;
    }
    .input-area button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { font-size: 0.85rem; color: #5c75a1; text-align: center; margin: 0; padding: 8px; }
  </style>
</head>
<body>
  <article class="chatcard">
    <header class="header">Gemini Chatbot</header>
    <div id="chat-window" class="window"></div>
    <p id="status" class="status">Ask a question. Gemini responds via your backend proxy.</p>
    <div class="input-area">
      <input id="user-input" type="text" placeholder="Type your message..." autofocus />
      <button id="send">Send</button>
    </div>
  </article>

  <script>
    const windowEl = document.getElementById('chat-window');
    const inputEl = document.getElementById('user-input');
    const buttonEl = document.getElementById('send');
    const statusEl = document.getElementById('status');

    function appendMessage(text, role) {
      const wrapper = document.createElement('div');
      wrapper.className = role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      windowEl.appendChild(wrapper);
      windowEl.scrollTop = windowEl.scrollHeight;
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;
      appendMessage(question, 'user');
      inputEl.value = '';
      inputEl.disabled = true;
      buttonEl.disabled = true;
      statusEl.textContent = 'Waiting for Gemini...';

      try {
        const res = await fetch('http://localhost:3001/api/gemini', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        const text = await res.text();
        let payload;
        try {
          payload = text ? JSON.parse(text) : {};
        } catch (parseErr) {
          throw new Error(`Failed to parse JSON from /api/gemini (status ${res.status}): ${text}`);
        }

        if (!res.ok) {
          throw new Error(payload.error || `Gemini error ${res.status}`);
        }

        appendMessage(payload.answer || 'No response from Gemini.', 'bot');
        statusEl.textContent = 'Answered. Ask another question.';
      } catch (err) {
        appendMessage('Error: ' + err.message, 'bot');
        statusEl.textContent = 'Error occurred; check console';
        console.error(err);
      } finally {
        inputEl.disabled = false;
        buttonEl.disabled = false;
        inputEl.focus();
      }
    }

    buttonEl.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
